{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container mt-4">
    
    <!-- Título y descripción dinámica del género que seleccionaste -->
    <h1 class="mb-3 text-center">{{ genero.nombre }}</h1>
    <p class="lead text-center text-muted mb-5">{{ genero.descripcion }}</p>

    <!-- Sistema de grillas de Bootstrap para ordenar las películas -->
    <div class="row">
        
        <!-- Ciclo FOR que recorre exclusivamente las 10 películas de este género -->
        {% for pelicula in genero.peliculas %}
        <div class="col-md-4 col-lg-3 mb-4">
            
            <!-- Componente Card de Bootstrap para cada película -->
            <div class="card h-100 shadow border-dark bg-dark text-white">
                
                <!-- Aquí cargamos la imagen desde tu carpeta static/images/ -->
                <!-- Nota: Si aún no descargas las imágenes, se verá el ícono de imagen rota, pero el código es el correcto -->
                <img src="{% static 'images/' %}{{ pelicula.imagen }}" class="card-img-top" alt="{{ pelicula.nombre }}" style="object-fit: cover; height: 350px;">
                
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title text-warning">{{ pelicula.nombre }}</h5>
                    <!-- El mt-auto empuja el año hacia abajo para que todas las tarjetas se vean alineadas -->
                    <p class="card-text mt-auto"><strong>Año:</strong> {{ pelicula.año }}</p>
                </div>

            </div>

        </div>
        {% endfor %}

    </div>
    
    <!-- Botón para volver a la pantalla de los géneros -->
    <div class="text-center mt-4 mb-5">
        <a href="{% url 'home_agustin:inicio' %}" class="btn btn-secondary btn-lg">Volver a los géneros</a>
    </div>

</div>
{% endblock %}
